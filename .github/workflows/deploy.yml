name: Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x demo-debug/gradlew

    - name: Build with Gradle
      run: cd demo-debug && ./gradlew clean build

    - name: Run tests
      run: cd demo-debug && ./gradlew test

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: jar-build
        path: demo-debug/build/libs/

    # Deploy to dhirajtech.in server via SSH
    - name: Deploy to dhirajtech.in
      uses: appleboy/ssh-action@master
      with:
        host: dhirajtech.in
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /var/www/demo-debug
          git pull origin master
          ./gradlew clean build
          systemctl restart demo-debug

    # Alternative: Copy JAR and restart service
    # - name: Deploy JAR to Server
    #   uses: appleboy/scp-action@master
    #   with:
    #     host: dhirajtech.in
    #     username: ${{ secrets.SERVER_USERNAME }}
    #     key: ${{ secrets.SSH_PRIVATE_KEY }}
    #     port: ${{ secrets.SSH_PORT }}
    #     source: "demo-debug/build/libs/demo-debug-0.0.1-SNAPSHOT.jar"
    #     target: "/var/www/demo-debug/build/libs"
    #     strip_components: 2
    #
    # - name: Restart Application Service
    #   uses: appleboy/ssh-action@master
    #   with:
    #     host: dhirajtech.in
    #     username: ${{ secrets.SERVER_USERNAME }}
    #     key: ${{ secrets.SSH_PRIVATE_KEY }}
    #     port: ${{ secrets.SSH_PORT }}
    #     script: systemctl restart demo-debug

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
    - name: Build result notification
      run: echo "Build completed with status - ${{ needs.build.result }}"
      # You can add email, Slack, or other notifications here

