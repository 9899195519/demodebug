name: Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x demo-debug/gradlew

      - name: Build with Gradle
        run: |
          cd demo-debug
          ./gradlew clean build -x test

      - name: Run Tests
        run: |
          cd demo-debug
          ./gradlew test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-build
          path: demo-debug/build/libs/*.jar

      - name: Deploy to dhirajtech.in
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dhirajtech.in
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/demo-debug

            git pull origin master

            chmod +x gradlew

            ./gradlew clean build -x test

            sudo systemctl restart demo-debug

            sudo systemctl status demo-debug

  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()

    steps:
      - name: Build Result Notification
        run: echo "Build completed with status - ${{ needs.build-and-deploy.result }}"